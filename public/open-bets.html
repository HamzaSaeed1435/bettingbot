<div class="wrap" style="padding-top:36px;">
  <div class="doc-title" style="margin-bottom:4px;">Open bets</div>
  <div class="doc-subtitle">Matches currently locked in and waiting on their real end time to settle.</div>

  <section class="block">
    <div class="block-head">
      <div class="block-title">Open bets <span class="count" id="openCount">(0)</span></div>
    </div>
    <div class="block-body">
      <div class="table-wrap">
        <table class="bets" id="openTable">
          <thead><tr><th>Match</th><th>Odds taken</th><th>Match ends</th><th>Stake</th><th>Profit</th><th></th></tr></thead>
          <tbody id="openTbody"></tbody>
        </table>
      </div>
      <div id="openEmpty" class="empty-note with-illustration">
        <svg class="empty-illustration" width="52" height="34" viewBox="0 0 64 40" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <rect x="2" y="2" width="60" height="36" rx="6"/>
          <circle cx="2" cy="20" r="6" fill="var(--paper)" stroke="none"/>
          <circle cx="62" cy="20" r="6" fill="var(--paper)" stroke="none"/>
          <line x1="34" y1="8" x2="34" y2="32" stroke-dasharray="3 3"/>
        </svg>
        No open bets right now.
      </div>
      <div class="day-total-row" id="dayTotalRow" style="display:none;">
        <span class="label">Pending total</span>
        <span class="value" id="dayTotalValue">$0.00</span>
      </div>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>
