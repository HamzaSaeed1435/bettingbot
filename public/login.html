<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Arbitrage Ledger</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<div class="wrap">
  <div class="login-card">
    <div class="brand-row" style="margin-bottom:4px;">
      <svg class="brand-logo" width="30" height="30" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="15" fill="var(--brass)"/>
        <text x="16" y="21.5" font-family="Georgia, serif" font-size="16" font-weight="700" fill="var(--paper)" text-anchor="middle">&#177;</text>
      </svg>
      <div class="brand-mark">Arb<span class="accent">itrage</span> Ledger</div>
    </div>
    <div class="brand-sub" style="margin-bottom:20px;">Enter the password to view the ledger</div>
    <div class="login-error" id="loginError" role="alert"></div>
    <div class="field">
      <label for="sitePwd">Password</label>
      <input id="sitePwd" type="password" autocomplete="current-password" autofocus>
    </div>
    <button class="btn primary" id="siteLoginBtn" style="width:100%;">Unlock</button>
  </div>
</div>

<script src="/site-login.js"></script>
</body>
</html>
